<article class="card fm-page" [attr.aria-label]="miner().cls + (miner().player ? ', ' + miner().player : '')">
  <header class="head">
    <div class="head__who">
      <h3 class="head__class">{{ miner().cls }}</h3>
      <span class="head__player">{{ miner().player || 'No player name' }}</span>
    </div>
    <div class="kda" aria-label="KDA ratio">
      <span class="kda__label">KDA</span>
      <span class="kda__value fm-numeral">{{ kda() }}</span>
    </div>
  </header>

  <div class="stats">
    @for (stat of stats; track stat.key) {
      <div class="stat">
        <span class="stat__label"><mat-icon>{{ stat.icon }}</mat-icon>{{ stat.label }}</span>
        <div class="stat__controls">
          <button
            type="button"
            class="stat__minus"
            [disabled]="miner().stats[stat.key] === 0"
            [attr.aria-label]="'Remove one from ' + stat.label"
            (click)="store.adjustStat(miner().cls, stat.key, -1)"
          >
            <mat-icon>remove</mat-icon>
          </button>
          <span class="stat__value fm-numeral" aria-live="polite">{{ miner().stats[stat.key] }}</span>
          <button
            type="button"
            class="stat__plus"
            [attr.aria-label]="'Add one to ' + stat.label"
            (click)="store.adjustStat(miner().cls, stat.key, 1)"
          >
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </div>
    }
  </div>
</article>
